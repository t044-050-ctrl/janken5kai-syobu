<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>じゃんけん５回勝負</title>
    <meta property="og:title" content="じゃんけん５回勝負">
　　<meta property="og:description" content="カプセル形をタップする場所（左・右）によって色が変わるアプリです。">
　　<meta property="og:type" content="website">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            position: fixed;
            inset: 0;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
            background-color: #f3f4f6;
            box-sizing: border-box;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* iPhoneの縦画面内で、比率を保ったまま正確に中央配置 */
        .iphone-container {
            width: min(100vw, calc(100dvh * 9 / 19.5));
            height: min(100dvh, calc(100vw * 19.5 / 9));
            aspect-ratio: 9 / 19.5;
            padding-top: max(env(safe-area-inset-top), 12px);
            padding-bottom: max(env(safe-area-inset-bottom), 12px);
            padding-left: max(env(safe-area-inset-left), 12px);
            padding-right: max(env(safe-area-inset-right), 12px);
            margin-inline: auto;
            overflow: hidden;
        }

        /* 見出しとリセットボタンの折り返し・押し合いを防ぐ */
        .app-header {
            width: 100%;
            min-width: 0;
            gap: 8px;
        }

        .app-heading {
            min-width: 0;
            white-space: nowrap;
        }

        #reset-btn {
            flex: 0 0 auto;
            white-space: nowrap;
        }

        /* カプセルは画面幅に対して中央に配置 */
        .shape {
            width: 82%;
            aspect-ratio: 2.4 / 1;
            box-sizing: border-box;
            flex: 0 0 auto;
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out, transform 0.1s ease;
        }

        .shape:active {
            transform: scale(0.97);
        }

        @media (max-width: 380px) {
            .app-heading h1 {
                font-size: 1rem;
            }
            #reset-btn {
                padding-left: 10px;
                padding-right: 10px;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center relative">

    <div class="iphone-container flex flex-col justify-between items-center relative z-0">
        
        <!-- ヘッダー＆リセットボタン領域 -->
        <div class="app-header flex justify-between items-center pt-2 px-2">
            <div class="app-heading text-left">
                <h1 class="text-lg sm:text-2xl font-bold text-gray-800 leading-tight">じゃんけん５回勝負</h1>
                <p class="text-xs sm:text-sm text-gray-500 mt-0.5">左：青 / 右：黄色</p>
            </div>
            <button id="reset-btn" class="px-3.5 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm bg-indigo-500 text-white font-semibold rounded-xl shadow-md hover:bg-indigo-600 active:scale-95 transition-all">
                リセット
            </button>
        </div>

        <!-- 5つのカプセルコンテナ（アスペクト比を維持して拡大） -->
        <div id="shape-container" class="w-full flex-1 flex flex-col items-center justify-center space-y-3 sm:space-y-4 py-2">
            <div class="shape rounded-full border-4 sm:border-[5px] border-gray-400 bg-white cursor-pointer shadow-sm"></div>
            <div class="shape rounded-full border-4 sm:border-[5px] border-gray-400 bg-white cursor-pointer shadow-sm"></div>
            <div class="shape rounded-full border-4 sm:border-[5px] border-gray-400 bg-white cursor-pointer shadow-sm"></div>
            <div class="shape rounded-full border-4 sm:border-[5px] border-gray-400 bg-white cursor-pointer shadow-sm"></div>
            <div class="shape rounded-full border-4 sm:border-[5px] border-gray-400 bg-white cursor-pointer shadow-sm"></div>
        </div>

        <!-- フッターインジケーター（装飾用） -->
        <div class="w-full flex justify-center pb-1">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('shape-container');
        const shapes = document.querySelectorAll('.shape');
        const resetButton = document.getElementById('reset-btn');

        // スワイプスクロールなどのブラウザデフォルト挙動を遮断
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        // カプセルタップ（左右判定）
        const handleShapeClick = (e) => {
            const shape = e.target.closest('.shape');
            if (!shape) return;

            const rect = shape.getBoundingClientRect();
            
            // タッチイベントまたはマウスイベントからクリック位置を取得
            let clickX;
            if (e.changedTouches && e.changedTouches.length > 0) {
                clickX = e.changedTouches[0].clientX;
            } else if (e.touches && e.touches.length > 0) {
                clickX = e.touches[0].clientX;
            } else {
                clickX = e.clientX;
            }

            const middleX = rect.left + rect.width / 2;

            if (clickX < middleX) {
                // 左側を押した場合 -> 青色
                shape.style.backgroundColor = '#60A5FA'; // blue-400
                shape.style.borderColor = '#3B82F6';     // blue-500
            } else {
                // 右側を押した場合 -> 黄色
                shape.style.backgroundColor = '#FBBF24'; // yellow-400
                shape.style.borderColor = '#F59E0B';     // yellow-500
            }
        };

        // イベント登録（クリックとタッチ）
        container.addEventListener('click', handleShapeClick);

        // リセットボタンの初期化機能
        resetButton.addEventListener('click', () => {
            shapes.forEach(shape => {
                shape.style.backgroundColor = 'white';
                shape.style.borderColor = '#9CA3AF'; // gray-400
            });
        });
    </script>
</body>
</html>
