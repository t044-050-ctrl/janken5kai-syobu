<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タップで色が変わる図形</title>
    <!-- Tailwind CSSを読み込みます -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ユーザーが誤ってテキストを選択してしまうのを防ぎます */
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            /* iOSなどで長押しした際に表示されるメニューを無効化します */
            -webkit-touch-callout: none;
        }
        .shape {
            /* 色の変化が滑らかに見えるようにアニメーションを設定します */
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }
    </style>
</head>
<!-- 'relative' クラスを追加して、子の絶対配置の基準にします。'min-h-screen'で縦長表示に対応 -->
<body class="bg-gray-100 flex items-center justify-center min-h-screen relative">

    <!-- リセットボタンを右上に配置します -->
    <button id="reset-btn" class="absolute top-4 right-4 px-4 py-2 text-sm bg-indigo-500 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-opacity-75 z-10">
        リセット
    </button>

    <!-- 画面サイズに応じてパディングを調整 (p-4 sm:p-8) -->
    <div class="flex flex-col items-center p-4 sm:p-8 bg-white rounded-2xl shadow-lg text-center mx-4">
        <h1 class="text-lg sm:text-xl font-semibold text-gray-800">タップで色を変えよう</h1>
        <!-- 説明文を修正しました -->
        <p class="text-sm sm:text-base text-gray-500 mb-4 sm:mb-6">左をおすと青色　右をおすと黄色</p>
        
        <!-- 図形を角丸の長方形に変更しました -->
        <div id="shape-container" class="flex flex-col items-center space-y-1 sm:space-y-3">
            <div class="shape w-32 h-14 sm:w-36 sm:h-16 rounded-full border-4 border-gray-400 bg-white cursor-pointer"></div>
            <div class="shape w-32 h-14 sm:w-36 sm:h-16 rounded-full border-4 border-gray-400 bg-white cursor-pointer"></div>
            <div class="shape w-32 h-14 sm:w-36 sm:h-16 rounded-full border-4 border-gray-400 bg-white cursor-pointer"></div>
            <div class="shape w-32 h-14 sm:w-36 sm:h-16 rounded-full border-4 border-gray-400 bg-white cursor-pointer"></div>
            <div class="shape w-32 h-14 sm:w-36 sm:h-16 rounded-full border-4 border-gray-400 bg-white cursor-pointer"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('shape-container');
        const shapes = document.querySelectorAll('.shape');
        const resetButton = document.getElementById('reset-btn');

        // クリック（タップ）の処理
        const handleShapeClick = (e) => {
            const shape = e.target;

            // クリックされた要素が図形でない場合は何もしない
            if (!shape.classList.contains('shape')) {
                return;
            }
            
            const rect = shape.getBoundingClientRect();
            // タッチイベントとマウスイベントで座標の取得方法を統一
            const clickX = e.clientX || (e.touches && e.touches[0].clientX);
            const middleX = rect.left + rect.width / 2;

            if (clickX < middleX) {
                // 左側をクリック -> 青色
                shape.style.backgroundColor = '#60A5FA'; // Tailwindのblue-400
                shape.style.borderColor = '#3B82F6';    // Tailwindのblue-500
            } else {
                // 右側をクリック -> 黄色
                shape.style.backgroundColor = '#FBBF24'; // Tailwindのyellow-400
                shape.style.borderColor = '#F59E0B';    // Tailwindのyellow-500
            }
        };
        
        // --- イベントリスナーの設定 ---
        
        // クリック（タップ）イベントのみに設定
        container.addEventListener('click', handleShapeClick);

        // リセットボタン（すべての図形を白に戻します）
        resetButton.addEventListener('click', () => {
            shapes.forEach(shape => {
                shape.style.backgroundColor = 'white';
                shape.style.borderColor = '#9CA3AF';
            });
        });
    </script>
</body>
</html>
